[project]
name = "plov-fly-brain"
version = "0.1.0"
description = "Reproducible local connectome simulation and an experimental plov environment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "brian2>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=2.1,<3",
  "scipy>=1.15,<2",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "numba>=0.61,<1",
  "joblib>=1.4,<2",
  "psutil>=6,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["brain/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["brain/data", "brain/runs", "brain/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
